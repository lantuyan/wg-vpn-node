# WireGuard VPN node. Always run as:  docker compose -p wgvpn-node ...
# (install.sh does). Publishes ONLY ${WG_PORT}/udp: the node serves no HTTP,
# it only calls central outbound. The project name, container name and port
# are distinct from the central stack (project "wgvpn"), so both can run on
# one host as long as WG_PORT differs.
services:
  node:
    build: .
    container_name: wgvpn-node
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    environment:
      TZ: ${TZ:-UTC}
      WGVPN_ROLE: node
      WGVPN_CENTRAL_URL: ${WGVPN_CENTRAL_URL:?WGVPN_CENTRAL_URL must be set in .env}
      WGVPN_NODE_ID: ${WGVPN_NODE_ID:?WGVPN_NODE_ID must be set in .env}
      WGVPN_NODE_SECRET: ${WGVPN_NODE_SECRET:?WGVPN_NODE_SECRET must be set in .env}
      # Public IP clients dial; empty = auto-detected.
      WGVPN_WG_HOST: ${WG_HOST:-}
      WGVPN_WG_PORT: ${WG_PORT:-51820}
      WGVPN_LOG_LEVEL: ${WGVPN_LOG_LEVEL:-INFO}
    volumes:
      - ./data:/data
    ports:
      - "${WG_PORT:-51820}:${WG_PORT:-51820}/udp"
    healthcheck:
      test: ["CMD", "wg", "show", "wg0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
